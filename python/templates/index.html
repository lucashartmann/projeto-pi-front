<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pintar parede com IA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            background: #151515;
            color: white;

            font-family:
                Arial,
                sans-serif;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 25px;

            padding: 20px;

            background: #222;

            border-radius: 12px;
        }

        button {
            padding: 12px 20px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        input[type="color"] {
            width: 60px;
            height: 45px;

            border: none;
            cursor: pointer;
        }

        .imagens {
            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(300px, 1fr));

            gap: 20px;
        }

        .card {
            background: #222;

            padding: 15px;

            border-radius: 12px;
        }

        img {
            display: block;

            width: 100%;

            border-radius: 8px;
        }

        #status {
            color: #ccc;
        }
    </style>
</head>

<body>
    <main>
        <h1>Pintar parede automaticamente</h1>
        <div class="controles">
            <input type="file" id="imagem" accept="image/*">
            <label> Cor:</label>
            <input type="color" id="cor" value="#d6c4ad">
            <button id="processar">Pintar parede</button>
            <span id="status"></span>
        </div>
        <div class="imagens">
            <div class="card">
                <h2>
                    Original
                </h2>
                <img id="original">
            </div>
            <div class="card">
                <h2>O que a IA detectou</h2>
                <img id="mascara">
            </div>
            <div class="card">
                <h2>Resultado</h2>
                <img id="resultado">
            </div>
        </div>
    </main>
    <script>
        const input =
            document.querySelector("#imagem");
        const cor =
            document.querySelector("#cor");
        const botao =
            document.querySelector("#processar");
        const original =
            document.querySelector("#original");
        const mascara =
            document.querySelector("#mascara");
        const resultado =
            document.querySelector("#resultado");
        const status =
            document.querySelector("#status");
        input.addEventListener(
            "change",
            () => {
                const arquivo =
                    input.files[0];
                if (!arquivo)
                    return;
                original.src =
                    URL.createObjectURL(
                        arquivo
                    );
            }
        );

        botao.addEventListener(
            "click",
            async () => {
                const arquivo =
                    input.files[0];
                if (!arquivo) {
                    alert(
                        "Escolha uma imagem."
                    );
                    return;
                }

                status.textContent =
                    "IA analisando a imagem...";

                const formData =
                    new FormData();

                formData.append(
                    "imagem",
                    arquivo
                );

                formData.append(
                    "cor",
                    cor.value
                );

                try {
                    const resposta =
                        await fetch(
                            "/processar",
                            {
                                method: "POST",
                                body: formData
                            }
                        );

                    const dados =
                        await resposta.json();

                    if (!resposta.ok) {
                        status.textContent =
                            dados.erro;
                        return;
                    }

                    mascara.src =
                        dados.mascara +
                        "?t=" +
                        Date.now();

                    resultado.src =
                        dados.resultado +
                        "?t=" +
                        Date.now();

                    status.textContent =
                        `Parede detectada: ${dados.parede_percentual}% da imagem`;
                }
                catch (erro) {
                    console.error(erro);
                    status.textContent =
                        "Erro ao processar.";
                }
            }
        );
    </script>
</body>
</html>
