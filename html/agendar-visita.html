<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/agendar-visita.css" />
  <link rel="icon" type="image/x-icon" href="../assets/logo.webp" />
  <script>
    if (localStorage.getItem("tema") === "escuro") {
      document.documentElement.classList.add("modo-noturno");
    }
    if (localStorage.getItem("contraste") === "alto") {
      document.documentElement.classList.add("alto-contraste");
    }
    if (localStorage.getItem("fontSize")) {
      document.documentElement.style.fontSize =
        localStorage.getItem("fontSize");
    }
  </script>
</head>

<body>
  <div id="acessibilidade">
    <button onclick="aumentarFonte()">A+</button>
    <button onclick="diminuirFonte()">A-</button>
    <button onclick="altoContraste()"><i class="fas fa-adjust"></i></button>
    <button onclick="modoNoturno()"><i class="fas fa-moon"></i></button>
  </div>
  <div id="pai-calendario">
    <div id="container-dados">
      <h2>Agendar visita para ...</h2>

      <form class="form-container">
        <input type="hidden" name="data" value="${dataSelecionada}" />

        <div class="linha">
          <div class="vertical-separator">
            <label>Nome do evento:</label>
            <input type="text" name="nome" required />
          </div>

          <div class="vertical-separator">
            <label>Hora do evento:</label>
            <input type="time" name="hora" required />
          </div>
        </div>

        <div class="linha">
          <div class="vertical-separator">
            <label>Cliente:</label>
            <select name="cliente" required></select>
          </div>

          <div class="vertical-separator">
            <label>Imóvel:</label>
            <select name="imovel" required></select>
          </div>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="confirmar" name="confirmar" />
          <label for="confirmar">Mandar email para cliente?</label>
        </div>

        <button type="submit">Agendar</button>
      </form>
    </div>
    <div class="ui container">
      <div class="ui grid">
        <div class="ui sixteen column">
          <div id="calendar"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Copyright 2025 - By Lucas Hartmann</p>
    <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
  </footer>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>

<script type="text/javascript">
  fetch("nav.html")
    .then((response) => response.text())
    .then((data) => {
      document.body.insertAdjacentHTML("afterbegin", data);
      var script = document.createElement("script");
    });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>

<script type="module" src="../js/modules/utils.js"></script>
<script type="module" src="../js/modules/usuario.js"></script>
<script type="module" src="../js/modules/notificacoes.js"></script>
<script type="module" src="../js/base.js"></script>
<script type="module" src="../js/agendar-visita.js"></script>

</html>
