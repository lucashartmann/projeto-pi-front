<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Imóvel</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dados-imovel.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/php/projeto-pi-front/assets/logo.webp">
</head>

<body>
    <div id="acessibilidade">
            <button onclick="aumentarFonte()">A+</button>
            <button onclick="diminuirFonte()">A-</button>
            <button onclick="altoContraste()"><i class="fas fa-adjust"></i></button>
            <button onclick="modoNoturno()"><i class="fas fa-moon"></i></button>
        </div>
    <div id="dados-imovel">
        <div id="div-pai">
            <div id="div-titulo">
                <h3>Casa no Campo com Jardim</h3>
                <p>Rua Joaquim Nabuco, 123, Cidade Baixa</p>

            </div>
            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"></div>
                    <div class="swiper-slide"></div>
                </div>
                <div class="swiper-pagination"></div>

                <div class="swiper-button-prev" onclick="prevSlide()"></div>
                <div class="swiper-button-next" onclick="nextSlide()"></div>

                <div class="swiper-scrollbar"></div>
            </div>
            <div class="swiper-galeria">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"></div>
                    <div class="swiper-slide"></div>
                </div>
                <div class="swiper-pagination"></div>

                <div class="swiper-button-prev" onclick="prevSlide()"></div>
                <div class="swiper-button-next" onclick="nextSlide()"></div>

            </div>
            <h3>Descrição</h3>
            <p id="p-descricao">Casa no Campo com Jardim, localizada em uma área tranquila e com ótima infraestrutura.
            </p>
        </div>
        <div id="entrar-contato">
            <div>
                <button>Agendar Visita</button>
                <button id="whatsapp"><i class="fab fa-whatsapp"></i> Whatsapp</button>
            </div>
            <div>
                <label id="condominio">Condominio: <p style='color:green;'>R$ 500,00</p></label>
                <div>
                    <label id="iptu">IPTU: <p style='color:green;'>R$ 200,00</p></label>
                    <button id="bt-contato">Entrar em contato</button>
                    <label>Um especialista irá entrar em contato por email ou whatsapp</label>
                </div>
            </div>
        </div>
    </div>


    <footer>
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        });

</script>
<script src="../js/base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

</html>
