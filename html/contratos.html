<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contratos</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/contratos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="icon" type="image/x-icon" href="../assets/logo.webp" />
  <script>
    if (localStorage.getItem("tema") === "escuro") {
      document.documentElement.classList.add("modo-noturno");
    }
    if (localStorage.getItem("contraste") === "alto") {
      document.documentElement.classList.add("alto-contraste");
    }
    if (localStorage.getItem("fontSize")) {
      document.documentElement.style.fontSize =
        localStorage.getItem("fontSize");
    }
  </script>
</head>

<body>

  <div id="h-buttons">
    <button>Salvar</button>
    <button>Apagar</button>
    <button onclick="montarConsulta()">Consultar</button>
  </div>

  <div id="resultado" style="display: none;">
    
  </div>

  <div id="pai">
    <form id="campo-dados">

      <div class="operacoes">
        <label class="check-card">
          <input type="checkbox" name="aluguel" id="aluguel">
          <span>Aluguel</span>
        </label>

        <label class="check-card">
          <input type="checkbox" name="venda" id="venda">
          <span>Venda</span>
        </label>
      </div>

      <div class="form-grid">

        <div class="campo campo-imovel">
          <label for="select-imovel">Imóvel</label>
          <select name="imovel" id="select-imovel" required>
            <option value="">Selecione uma opção...</option>
          </select>
        </div>

        <div class="campo">
          <label for="select-proprietario">Proprietário do Imóvel</label>
          <select name="proprietario" id="select-proprietario" required>
            <option value="">Selecione uma opção...</option>
          </select>
        </div>

        <div class="campo">
          <label for="select-locador">Locador/Comprador</label>
          <select name="locador" id="select-locador" required>
            <option value="">Selecione uma opção...</option>
          </select>
        </div>

        <div class="campo tempo">
          <label for="tempo">Tempo de Contrato</label>

          <div class="input-group">
            <input type="number" id="tempo" name="tempo" min="1" required>

            <select name="tipo-tempo" aria-label="Unidade de tempo">
              <option value="meses">Meses</option>
              <option value="anos">Anos</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="termino" >Data de Término do contrato</label>
          <input type="date" id="termino" name="termino" required>
        </div>

        <div class="campo valor">
          <label for="valor-aluguel">Valor Aluguel</label>

          <div class="valor-group">
            <input type="text" id="valor-aluguel" name="valor-aluguel" placeholder="R$ 0,00" disabled>

            <label class="check-inline">
              <input type="checkbox" id="mesmo-aluguel" name="mesmo-aluguel" disabled>
              <span>Mesmo do imóvel</span>
            </label>
          </div>
        </div>

        <div class="campo valor">
          <label for="valor-venda">Valor Venda</label>

          <div class="valor-group">
            <input type="text" id="valor-venda" name="valor-venda" placeholder="R$ 0,00" disabled>

            <label class="check-inline">
              <input type="checkbox" id="mesmo-venda" name="mesmo-venda" disabled>
              <span>Mesmo do imóvel</span>
            </label>
          </div>
        </div>

      </div>

      <textarea name="observacoes" id="observacoes" placeholder="Observações..."></textarea>

    </form>
  </div>

  <div id="container-anexos" class="container">
    <header>
      <label for="">Anexos:</label>
      <button class="bt-adicionar-anexos" onclick="adicionarAnexo(event)">
        Adicionar
      </button>
      <button class="selecionar-todos" onclick="selecionarTodos(event)">
        Selecionar Todos
      </button>
      <button class="abrir-multiplos" onclick="abrirMultiplosAnexos(event)">
        Abrir
      </button>
      <button class="apagar-multiplos" onclick="apagarMultiplos(event)">
        Apagar
      </button>
      <p id="contador-documentos">0 anexos</p>
    </header>
  </div>

  <div id="acessibilidade">
    <button onclick="aumentarFonte()">A+</button>
    <button onclick="diminuirFonte()">A-</button>
    <button onclick="altoContraste()"><i class="fas fa-adjust"></i></button>
    <button onclick="modoNoturno()"><i class="fas fa-moon"></i></button>
  </div>

<script type="text/javascript">
  fetch("nav.html")
    .then((response) => response.text())
    .then((data) => {
      const inicio = data.lastIndexOf("<div class=");
      const fim = data.lastIndexOf("</div>");
      const substring = data.substring(inicio + 20, fim);
      data = data.replace(substring, "");
      document.body.insertAdjacentHTML("afterbegin", data);
    });
</script>
