<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-signin-client_id" content="YOUR_CLIENT_ID.apps.googleusercontent.com">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/x-icon" href="/php/projeto-pi-front/assets/logo.png">
</head>

<body>
    <div id="login-container">
        <div id="login-header">
            <h1 id="h3-login">Login</h1>
            <h1 id="barra">|</h1>
            <h1 id="h3-cadastro">Cadastro</h1>
        </div>
        <form id="form-nova-senha" onsubmit="enviarNovaSenha()" style="display: none;">
            <h2>Recuperar Senha</h2>
            <input type="text" id="email" name="email" placeholder="Digite seu email" required>
            <button type="submit">Enviar</button>
            <a href="" id="voltar-login" onclick="voltarLogin()">Voltar para Login</a>
        </form>
        <form onsubmit="fazerCadastro()" id="form-cadastro" style="display: none;">
            <h3>Nome Completo</h3>
            <input type="text" name="nome" id="nome" autocomplete="name" required>
            <h3>Data de Nascimento</h3>
            <input type="date" name="data_nascimento" id="data-nascimento" required oninput="verificaDataNascimento()">
            <h3>CPF/CNPJ</h3>
            <input type="text" name="cpf_cnpj" id="cpf_cnpj" autocomplete="off" minlength="14" maxlength="14" required>
            <h3>Email</h3>
            <input type="email" name="email" id="email-cadastro" autocomplete="email" required>
            <h3>Senha</h3>
            <div class="senha-container">
                <input type="password" name="senha" class="senha" id="senha-cadastro"
                    oninput="verificaSenha(); verificaDataNascimento();" autocomplete="current-password" minlength="8"
                    required>
                <i class="fas fa-eye-slash" onclick="togglePasswordVisibility(event)"></i>
            </div>
            <button type="submit" onsubmit="fazerCadastro()">Cadastrar</button>
        </form>
        <form onsubmit="fazerLogin()" id="form-login">
            <h3>Email</h3>
            <input type="text" name="email" id="usuario" required autocomplete="email">
            <!--  Mudar para email depois -->
            <h3>Senha</h3>
            <div class="senha-container">
                <input type="password" name="senha" id="senha" class="senha" autocomplete="current-password"
                    minlength="3" required>
                <i class="fas fa-eye-slash" onclick="togglePasswordVisibility(event)"></i>
            </div>
            <button type="submit" onsubmit="fazerLogin()">Login</button>
            <button class="gsi-material-button" style="width:40">
                <div class="gsi-material-button-state"></div>
                <div class="gsi-material-button-content-wrapper">
                    <div class="gsi-material-button-icon">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                            xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                            </path>
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                            </path>
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                            </path>
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                            </path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                    </div>
                    <span class="gsi-material-button-contents">Entrar com Google</span>
                    <span style="display: none;">Entrar com Google</span>
                </div>
            </button>
            <a href="" id="esqueceu-senha" onclick="novaSenha()">Esqueceu a senha?</a>
        </form>
    </div>
    <footer>
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            const inicio = data.lastIndexOf("<div class=");
            const fim = data.lastIndexOf("</div>");
            const substring = data.substring(inicio + 20, fim);
            data = data.replace(substring, "");
            document.body.insertAdjacentHTML('afterbegin', data);
        });

</script>
<script src="../js/base.js"></script>
<script src="../js/login.js"></script>
<script src="https://apis.google.com/js/platform.js" async defer></script>

</html>
