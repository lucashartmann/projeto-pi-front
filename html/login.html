<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">

    <link rel="icon" type="image/x-icon" href="img/logo.png">
</head>

<body>
    <div>
        <div id="login-header">
                <h1 id="h3-login">Login</h1>
                <h1 id="barra">|</h1>
                <h1 id="h3-cadastro">Cadastro</h1>
        </div>
        <form onsubmit="fazerCadastro()" id="form-cadastro">
            <h3>Nome Completo</h3>
            <input type="text" name="nome" id="nome" autocomplete="name" required>
            <h3>Data de Nascimento</h3>
            <input type="date" name="data_nascimento" id="data-nascimento" required>
            <h3>CPF</h3>
            <input type="text" name="cpf" id="cpf" autocomplete="off" minlength="14" maxlength="14" required>
            <h3>Email</h3>
            <input type="email" name="email" id="email-cadastro" autocomplete="email" required>
            <h3>Senha</h3>
            <div class="senha-container">
                <input type="password" name="senha" class="senha" id="senha-cadastro" oninput="verificaSenha()" autocomplete="current-password" minlength="8" required>
                <i class="fas fa-eye-slash" onclick="togglePasswordVisibility(event)"></i>
            </div>
            <button type="submit" onsubmit="fazerCadastro()">Cadastrar</button>
        </form>
        <form onsubmit="fazerLogin()" id="form-login">
            <h3>Email</h3>
            <input type="text" name="email" id="usuario" required autocomplete="username">
            <!--  Mudar para email depois -->
            <h3>Senha</h3>
            <div class="senha-container">
                <input type="password" name="senha" id="senha" class="senha" autocomplete="current-password" minlength="3" required>
                <i class="fas fa-eye-slash" onclick="togglePasswordVisibility(event)"></i>
            </div>
            <button type="submit" onsubmit="fazerLogin()">Login</button>
        </form>
    </div>
    <footer>
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            const inicio = data.lastIndexOf("<div class=");
            const fim = data.lastIndexOf("</div>");
            const substring = data.substring(inicio + 20, fim);
            data = data.replace(substring, "");
            document.body.insertAdjacentHTML('afterbegin', data);
        });

</script>

<script src="../js/login.js"></script>

</html>
