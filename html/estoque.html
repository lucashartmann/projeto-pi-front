<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/php/projeto-pi-front/assets/logo.png">
</head>

<body>
    <main>
        <div id="dados-div">
            <div>
                <h3>Imóveis: 10</h3>
                <!-- (para aluguel ou venda, depende do selecionado) -->
            </div>
        </div>

        <div id="container-filtragem">
            <input placeholder="Pesquise aqui" id="input-pesquisa">
            <label>Categoria</label>
            <select prompt="Selecionar"></select>
            <label>Status</label>
            <select prompt="Selecionar"></select>
            <label>CEP</label>
            <input>
            <label>Número</label>
            <input>
        </div>
        <div id="h-filtro">
            <select id="select-filtro" onchange="filtrar()">
                <option value="referencia">Referência</option>
                <option value="categoria">Categoria</option>
                <option value="status">Status</option>
                <option value="cep">CEP</option>
                <option value="numero">Número</option>
                <option value="aluguel">Aluguel</option>
                <option value="venda">Venda</option>
                <option value="data_cadastro" selected>Data de Cadastro</option>
                <option value="data_modificacao">Data de Modificação</option>
            </select>
            <button id="seta" flat=True onclick="mudarOrdem()">⬇️</button>
        </div>
        <section id="container-resultado">
            <div class="resultado" onclick="abrirCadastro(0)">
                <img src="../assets/apartament.jpg" alt="">
                <div class="dados">
                    <label for="">REF: 001</label>
                    <label>Apartamento 2 dormitórios</label>
                    <label for="">Avenida Bento Gonçalves</label>
                    <label for="">Apartamento</label>
                    <label for="">Venda</label>
                </div>
            </div>
            <div class="resultado" onclick="abrirCadastro(1)">
                <img src="../assets/campo.jpg" alt="">
                <div class="dados">
                    <label for="">REF: 002</label>
                    <label>Casa no Campo com Jardim</label>
                    <label for="">Rua Joaquim Nabuco</label>
                    <label for="">Casa</label>
                    <label for="">Venda e Aluguel</label>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
            var script = document.createElement('script');
            script.src = '../js/base.js';
            script.type = 'text/javascript';
            script.async = false;
            document.body.appendChild(script);
        });

</script>
<!-- <script src="../js/base.js"></script>
<script src="../js/estoque.js"></script> -->

</html>
