<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/php/projeto-pi-front/assets/logo.webp">
</head>

<body>
    <main>
        <div id="container-pai">
            <div id="container-filtragem">
                <input placeholder="Pesquise aqui" id="input-pesquisa" oninput="pesquisar(event)">
                <label for="" id="stt-categoria">Categoria:</label>
                <select name="categoria" id="select-categoria" onchange="pesquisar(event)">
                    <option value="" selected>Selecione uma opção...</option>
                    <option value="Sala Comercial">Sala Comercial</option>
                    <option value="Apartamento">Apartamento</option>
                    <option value="Casa">Casa</option>
                    <option value="Chácara">Chácara</option>
                    <option value="Fazenda">Fazenda</option>
                    <option value="Casa em Condomínio">Casa em Condomínio</option>
                    <option value="Empreendimento">Empreendimento</option>
                    <option value="Ponto Comercial">Ponto Comercial</option>
                    <option value="Prédio Comercial">Prédio Comercial</option>
                    <option value="Galpão">Galpão</option>
                    <option value="Depósito">Depósito</option>
                    <option value="Loja">Loja</option>
                    <option value="Cobertura">Cobertura</option>
                    <option value="Loft">Loft</option>
                    <option value="Terreno">Terreno</option>
                    <option value="Kitnet">Kitnet</option>
                    <option value="Sobrado">Sobrado</option>
                    <option value="Pavilhão">Pavilhão</option>
                    <option value="Depósito">Depósito</option>
                    <option value="Studio">Studio</option>
                </select>

                <label for="" id="stt-situacao">Situação</label>
                <select name="situacao" id="select-situacao" onchange="pesquisar(event)">
                    <option value="" selected>Selecione uma opção...</option>
                    <option value="Em Construção">Em Construção</option>
                    <option value="Novo">Novo</option>
                    <option value="Usado">Usado</option>
                </select>
                <label for="" id="stt-estado-select">Estado:</label>
                <select name="estado_imovel" id="select-estado" onchange="pesquisar(event)">
                    <option value="" selected>Selecione uma opção...</option>
                    <option value="Bom">Bom</option>
                    <option value="Ótimo">Ótimo</option>
                    <option value="Regular">Regular</option>
                </select>
                <label for="" id="stt-ocupacao">Ocupação:</label>
                <select name="ocupacao" id="select-ocupacao" onchange="pesquisar(event)">
                    <option value="" selected>Selecione uma opção...</option>
                    <option value="Desocupado">Desocupado</option>
                    <option value="Inquilino">Inquilino</option>
                    <option value="Proprietário">Proprietário</option>
                </select>
                <label for="" id="stt-status">Status:</label>
                <select name="status" id="select-status" onchange="pesquisar(event)">
                    <option value="" selected>Selecione uma opção...</option>
                    <option value="Venda">Venda</option>
                    <option value="Aluguel">Aluguel</option>
                    <option value="Venda e Aluguel">Venda e Aluguel</option>
                    <option value="Alugado">Alugado</option>
                    <option value="Vendido">Vendido</option>
                    <option value="Pendente">Pendente</option>
                </select>
                <label>CEP</label>
                <input type="text" id="input-cep" oninput="pesquisar(event)">
                <label>Número</label>
                <input type="text" id="input-numero" oninput="pesquisar(event)">
            </div>
        </div>
        <div id="h-filtro">
            <select id="select-filtro" onchange="filtrar()">
                <option value="referencia">Referência</option>
                <option value="categoria">Categoria</option>
                <option value="status">Status</option>
                <option value="cep">CEP</option>
                <option value="numero">Número</option>
                <option value="aluguel">Aluguel</option>
                <option value="venda">Venda</option>
                <option value="data_cadastro" selected>Data de Cadastro</option>
                <option value="data_modificacao">Data de Modificação</option>
            </select>
            <button id="seta" flat=True onclick="mudarOrdem()">⬇️</button>
            <button id="selecionar-todos" onclick="selecionarTodos()">Selecionar Todos</button>
            <button id="abrir-multiplos" style="display: none;" onclick="abrirMultiplos()">Abrir</button>
            <button id="apagar-multiplos" style="display: none;" onclick="apagarMultiplos()">Apagar</button>
            <p id="contador-imoveis">0 imóveis</p>
        </div>
        <section id="container-resultado">
            <div class="resultado" onclick="abrirCadastro(0)">
                <img src="../assets/apartament.jpg" alt="">
                <div class="dados">
                    <label for="">REF: 001</label>
                    <label>Apartamento 2 dormitórios</label>
                    <label for="">Avenida Bento Gonçalves</label>
                    <label for="">Apartamento</label>
                    <label for="">Venda</label>
                </div>
            </div>
            <div class="resultado" onclick="abrirCadastro(1)">
                <img src="../assets/campo.jpg" alt="">
                <div class="dados">
                    <label for="">REF: 002</label>
                    <label>Casa no Campo com Jardim</label>
                    <label for="">Rua Joaquim Nabuco</label>
                    <label for="">Casa</label>
                    <label for="">Venda e Aluguel</label>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        });
</script>
<script src="../js/base.js"></script>
<script src="../js/estoque.js"></script>

</html>
