<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../assets/logo.webp">
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("modo-noturno");
        }
        if (localStorage.getItem("contraste") === "alto") {
            document.documentElement.classList.add("alto-contraste");
        }
        if (localStorage.getItem("fontSize")) {
            document.documentElement.style.fontSize = localStorage.getItem("fontSize");
        }
    </script>
</head>

<body>
    <main>
        <nav class="sidebar-anuncios" id="sidebar-pessoas">
            <label>Cadastro</label>
            <select name="cadastro" id="select-cadastro" onchange="trocarCadastro(event)">
                <option value="">Selecione uma opção...</option>
                <option value="imovel">Imóvel</option>
                <option value="cliente">Cliente</option>
                <option value="corretor">Corretor</option>
                <option value="proprietario">Proprietário</option>
                <option value="vistoriador">Vistoriador</option>
                <option value="gerente">Gerente</option>
                <option value="administrador">Administrador</option>
                <option value="financeiro">Financeiro</option>
                <option value="captador">Captador</option>
            </select>
            <label>Nome</label>
            <input type="text" id="input-nome">
            <label>CPF/CNPJ</label>
            <input type="text" id="input-cpf-cnpj">
            <label for="input-data-cadastro">Data de Cadastro</label>
            <input type="date" id="input-data-cadastro">
            <label for="input-data-modificacao">Data de Modificação</label>
            <input type="date" id="input-data-modificacao">
            <label for="input-creci">CRECI</label>
            <input type="text" id="input-creci">
            <label for="input-salario">Salário</label>
            <input type="number" id="input-salario" step="0.01">
        </nav>
        <nav class="sidebar-anuncios" id="sidebar-imoveis">
            <label>Cadastro</label>
            <select name="cadastro" id="select-cadastro" onchange="trocarCadastro(event)">
                <option value="">Selecione uma opção...</option>
                <option value="imovel" selected>Imóvel</option>
                <option value="cliente">Cliente</option>
                <option value="corretor">Corretor</option>
                <option value="proprietario">Proprietário</option>
            </select>
            <label>Categoria</label>
            <select name="categoria" id="select-categoria">
                <option value="" selected>Selecione uma opção...</option>
                <option value="Sala Comercial">Sala Comercial</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Casa">Casa</option>
                <option value="Chácara">Chácara</option>
                <option value="Fazenda">Fazenda</option>
                <option value="Casa em Condomínio">Casa em Condomínio</option>
                <option value="Empreendimento">Empreendimento</option>
                <option value="Ponto Comercial">Ponto Comercial</option>
                <option value="Prédio Comercial">Prédio Comercial</option>
                <option value="Galpão">Galpão</option>
                <option value="Depósito">Depósito</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Loja">Loja</option>
                <option value="Cobertura">Cobertura</option>
                <option value="Loft">Loft</option>
                <option value="Terreno">Terreno</option>
                <option value="Kitnet">Kitnet</option>
                <option value="Sobrado">Sobrado</option>
                <option value="Pavilhão">Pavilhão</option>
                <option value="Depósito">Depósito</option>
                <option value="Studio">Studio</option>
            </select>
            <label>Status</label>
            <select name="status" id="select-status">
                <option value="" selected>Selecione uma opção...</option>
                <option value="Venda">Venda</option>
                <option value="Aluguel">Aluguel</option>
                <option value="Venda e Aluguel">Venda e Aluguel</option>
                <option value="Alugado">Alugado</option>
                <option value="Vendido">Vendido</option>
                <option value="Pendente">Pendente</option>
            </select>
            <label for="" id="stt-situacao">Situação</label>
            <select name="situacao" id="select-situacao">
                <option value="" selected>Selecione uma opção...</option>
                <option value="Em Construção">Em Construção</option>
                <option value="Novo">Novo</option>
                <option value="Usado">Usado</option>
            </select>
            <label for="" id="stt-estado-select">Estado:</label>
            <select name="estado_imovel" id="select-estado">
                <option value="" selected>Selecione uma opção...</option>
                <option value="Bom">Bom</option>
                <option value="Ótimo">Ótimo</option>
                <option value="Regular">Regular</option>
            </select>
            <label for="" id="stt-ocupacao">Ocupação:</label>
            <select name="ocupacao" id="select-ocupacao">
                <option value="" selected>Selecione uma opção...</option>
                <option value="Desocupado">Desocupado</option>
                <option value="Inquilino">Inquilino</option>
                <option value="Proprietário">Proprietário</option>
            </select>
            <label for="">Quartos: </label>
            <div id="preco">
                <input type="number" name="quantidade_minima_quartos" id="quartos-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="quantidade_maxima_quartos" id="quartos-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="">Banheiros: </label>
            <div id="preco">
                <input type="number" name="quantidade_minima_banheiros" id="banheiros-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="quantidade_maxima_banheiros" id="banheiros-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="">Vagas: </label>
            <div id="preco">
                <input type="number" name="quantidade_minima_vagas" id="vagas-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="quantidade_maxima_vagas" id="vagas-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="">Salas: </label>
            <div id="preco">
                <input type="number" name="quantidade_minima_sala" id="salas-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="quantidade_maxima_sala" id="salas-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="">Varandas: </label>
            <div id="preco">
                <input type="number" name="quantidade_minima_varandas" id="varandas-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="quantidade_maxima_varandas" id="varandas-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label>Preço:</label>
            <div id="preco">
                <input type="number" name="preco_minimo" id="preco-minimo" min="0" max="10000000" placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="preco_maximo" id="preco-maximo" min="0" max="10000000" placeholder="Máximo">
            </div>
            <label for="" id="stt-area-total">Área Total</label>
            <div id="preco">
                <input type="number" name="area_total_minima" id="area-total-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="area_total_maxima" id="area-total-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="" id="stt-area-privativa">Área Privativa</label>
            <div id="preco">
                <input type="number" name="area_privativa_minima" id="area-privativa-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="area_privativa_maxima" id="area-privativa-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="" id="stt-condominio">Valor Condomínio:</label>
            <div id="preco">
                <input type="number" name="valor_condominio_minimo" id="valor-condominio-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="valor_condominio_maximo" id="valor-condominio-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>
            <label for="" id="stt-iptu">Valor IPTU:</label>
            <div id="preco">
                <input type="number" name="valor_iptu_minimo" id="valor-iptu-minimo" min="0" max="20"
                    placeholder="Mínimo">
                <label>-</label>
                <input type="number" name="valor_iptu_maximo" id="valor-iptu-maximo" min="0" max="20"
                    placeholder="Máximo">
            </div>

            <label>CEP</label>
            <input type="text" name="cep" id="input-cep" oninput="pesquisarCEP(event)">
            <label for="" id="stt-rua">Rua</label>
            <textarea id="ta-rua" readonly=True name="rua"></textarea>
            <label for="" id="stt-numero">Número</label>
            <input type="number" id="ta-numero" name="numero">
            <label for="" id="stt-complemento">Complemento</label>
            <textarea name="complemento" id="ta-complemento"></textarea>
            <label for="" id="stt-bloco">Bloco</label>
            <textarea name="bloco" id="ta-bloco"></textarea>
            <label for="" id="stt-andar">Andar</label>
            <input type="number" placeholder="00" id="ta-andar" min="0" max="99" name="andar">
            <label for="" id="stt-bairro">Bairro</label>
            <textarea id="ta-bairro" readonly=True name="bairro"></textarea>
            <label for="" id="stt-cidade">Cidade</label>
            <textarea id="ta-cidade" readonly=True name="cidade"></textarea>
            <label for="" id="stt-estado">Estado</label>
            <input type="text" readonly=True, placeholder="XX" id="ta-estado" minlength="2" maxlength="2" name="uf">
            <label>Apartamento</label>
            <div id="container-info-imovel">
                <input type="checkbox" id="filtro-aceita-pet" value="Aceita Pet">
                <label for="filtro-aceita-pet">Aceita Pet</label>
                <input type="checkbox" id="filtro-churrasqueira" value="Churrasqueira">
                <label for="filtro-churrasqueira">Churrasqueira</label>
                <input type="checkbox" id="filtro-armarios-embutidos" value="Armarios Embutidos">
                <label for="filtro-armarios-embutidos">Armarios Embutidos</label>
                <input type="checkbox" id="filtro-cozinha-americana" value="Cozinha Americana">
                <label for="filtro-cozinha-americana">Cozinha Americana</label>
                <input type="checkbox" id="filtro-area-de-servico" value="Área de Serviço">
                <label for="filtro-area-de-servico">Área de Serviço</label>
                <input type="checkbox" id="filtro-suíte-master" value="Suíte Master">

                <label for="filtro-mobiliado">Mobiliado</label>
                <input type="checkbox" id="filtro-dependencia-de-empregada" value="Dependência de Empregada">
                <label for="filtro-dependencia-de-empregada">Dependência de Empregada</label>
                <input type="checkbox" id="filtro-despensa" value="Despensa">

                <input type="checkbox" id="filtro-deposito" value="Depósito">
                <label for="filtro-deposito">Depósito</label>
            </div>

            <label for="">Condomínio</label>
            <div id="container-info-condominio">
                <input type="checkbox" id="filtro-churrasqueira-coletiva" value="Churrasqueira Coletiva">
                <label for="filtro-churrasqueira-coletiva">Churrasqueira Coletiva</label>
                <input type="checkbox" id="filtro-piscina" value="Piscina">
                <label for="filtro-piscina">Piscina</label>
                <input type="checkbox" id="filtro-piscina-infantil" value="Piscina Infantil">
                <label for="filtro-piscina-infantil">Piscina Infantil</label>
                <input type="checkbox" id="filtro-piscina-aquecida" value="Piscina Aquecida">
                <label for="filtro-piscina-aquecida">Piscina Aquecida</label>
                <input type="checkbox" id="filtro-quiostique" value="Quiosque">

                <input type="checkbox" id="filtro-quadra-de-esportes" value="Quadra de Esportes">

                <input type="checkbox" id="filtro-academia" value="Academia">
                <label for="filtro-academia">Academia</label>
                <input type="checkbox" id="filtro-sala-de-jogos" value="Sala de Jogos">
                <label for="filtro-sala-de-jogos">Sala de Jogos</label>
                <input type="checkbox" id="filtro-playground" value="Playground">
