<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Dados do Cliente</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dados-cliente.css">

    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("modo-noturno");
        }
        if (localStorage.getItem("contraste") === "alto") {
            document.documentElement.classList.add("alto-contraste");
        }
        if (localStorage.getItem("fontSize")) {
            document.documentElement.style.fontSize = localStorage.getItem("fontSize");
        }
    </script>

</head>

<body>
    <div id="acessibilidade">
        <button onclick="aumentarFonte()">A+</button>

        <button onclick="altoContraste()"><i class="fas fa-adjust"></i></button>
        <button onclick="modoNoturno()"><i class="fas fa-moon"></i></button>
    </div>
    <section class="grid-container">

            <div id="dados-basicos">

        <div id="lala">

                    <li>

                    </li>
                    <li>
                        <a href="#" onclick="alterarSrc(event, 'html/anuncios.html?favoritos=true')">Ver Favoritos</a>
                    </li>
                    <li>
                        <a href="#" onclick="alterarSrc(event, 'html/atendimento-cliente.html')">Ver Atendimentos</a>
                    </li>

                    </li>
                    <li><a href="#" onclick="trocarRecuperarSenha()">Trocar/Recuperar Senha</a></li>
