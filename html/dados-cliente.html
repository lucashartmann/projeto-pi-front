<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Cliente</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dados-cliente.css">
    <link rel="icon" type="image/x-icon" href="/php/projeto-pi-front/assets/logo.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../assets/logo.webp">
    <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>
</head>

<body>
    <div>
        <form class="grid-container">
            <!-- <label>Username</label>
            <input name="username" type="text" id="inpt-username"> -->
            <div class="vertical-separator">
                <label id="stt-nome">Nome</label>
                <input id="inpt-nome" type="text" name="nome">
            </div>
            <div id="container-telefones">
                <label id="stt-email">Email</label>
                <input type="email" id="inpt-email" name="email">
            </div>
            <div id="container-telefones">
                <label id="stt-telefone">Telefone</label>
                <div id="container-telefones">
                    <input id="inpt-telefone" type="text" class="telefone" maxlength="15">
                    <button id="bt-mais-numero" onclick="adicionarNumeroTelefone()">+</button>
                    <button id="bt-remover-numero" onclick="removerNumeroTelefone()">X</button>
                </div>
            </div>
            <div id="container-telefones">
                <label id="stt-data-nascimento">Data de nascimento</label>
                <input type="date" id="inpt-data-nascimento" maxlength="10" minlength="10" name="data_nascimento">
            </div>
            <div id="container-telefones">
                <label id="stt-cpf">CPF</label>
                <input type="text" id="inpt-cpf" maxlength="14" minlength="14" name="cpf_cnpj">
            </div>
            <div id="container-telefones">
                <label id="stt-rg">RG</label>
                <input id="inpt-rg" max="9" min="7" type="number" name="rg">
            </div>
            <div id="container-telefones">
                <label>Senha</label>
                <input type="password" name="senha" id="inpt-senha" minlength="8" maxlength="255">
            </div>
        </form>
        <h3 id="stt-detalhes">Detalhes do imóvel desejado:</h3>
        <form id="detalhes">
            <div class="detalhes-content">
                <label>Quartos:</label>
                <input type="text" name="quartos" id="inpt-quartos" maxlength="2">
            </div>
            <div class="detalhes-content">
                <label>Banheiros:</label>
                <input type="text" name="banheiros" id="inpt-banheiros" maxlength="2">
            </div>
            <div class="detalhes-content">
                <label>CEP desejado:</label>
                <input type="text" id="inpt-cep" minlength="9" maxlength="9">
            </div>
        </form>
        <div id="ctn-botao">
            <button onclick="salvarDados()">Salvar</button>
        </div>
        <label id="stt-compras">Imoveis do usuário (links para os anuncios)</label>
        <div id="imoveis"></div>
    </div>
    <footer class="">
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>


</body>

        });
</script>

<script src="../js/dados-cliente.js"></script>

</html>
