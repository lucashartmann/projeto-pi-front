<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Cliente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dados-cliente.css">
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div>
        <form class="grid-container">
            <!-- <label>Username</label>
            <input name="username" type="text" id="inpt-username"> -->
            <label id="stt-nome">Nome</label>
            <input placeholder="nome aqui" id="inpt-nome" type="text">
            <label id="stt-email">Email</label>
            <input type="email" placeholder="email aqui" id="inpt-email">
            <label id="stt-telefone">Telefone</label>
            <div id="container-telefones">
                <input placeholder="(00) 00000-0000" id="inpt-telefone" type="text">
                <button id="bt-mais-numero">+</button>
                <button id="bt-remover-numero">X</button>
            </div>
            <label id="stt-cep">CEP</label>
            <input type="text" id="ta-cep" maxlength="9" minlength="9" required placeholder="00000-000">
            <label id="stt-rua">Rua</label>
            <textarea disabled=True id="ta-rua"></textarea>
            <label id="stt-numero">Número do endereço</label>
            <input id="ta-numero" type="number">
            <label id="stt-complemento">Complemento do endereço</label>
            <textarea id="ta-complemento"></textarea>
            <label id="stt-bloco">Bloco do endereço</label>
            <textarea id="ta-bloco"></textarea>
            <label id="stt-bairro">Bairro</label>
            <textarea id="ta-bairro" disabled=True></textarea>
            <label id="stt-cidade">Cidade</label>
            <textarea id="ta-cidade" disabled=True></textarea>
            <label id="stt-estado">Estado</label>
            <input disabled=True placeholder="XX" id="ta-estado" maxlength="2" minlength="2" type="text">
            <label id="stt-data-nascimento">Data de nascimento</label>
            <input placeholder="00/00/0000" type="date" id="inpt-data-nascimento" maxlength="10" minlength="10">
            <label id="stt-cpf">CPF</label>
            <input placeholder="000.000.000-00" type="text" id="inpt-cpf" maxlength="14" minlength="14">
            <label id="stt-rg">RG</label>
            <input id="inpt-rg" placeholder="RG aqui" max="9" min="7" type="number">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="alterar senha" id="inpt-senha">
        </form>
        <h3 id="stt-detalhes">Detalhes do imóvel desejado:</h3>
        <form id="detalhes">
            <div class="detalhes-content">
                <label>Quartos:</label>
                <input type="text" placeholder="00" name="quartos" id="inpt-quartos" maxlength="2">
            </div>
            <div class="detalhes-content">
                <label>Banheiros:</label>
                <input type="text" placeholder="00" name="banheiros" id="inpt-banheiros" maxlength="2">
            </div>
            <div class="detalhes-content">
                <label>CEP desejado:</label>
                <input type="text" placeholder="00000-000" id="inpt-cep" minlength="9" maxlength="9">
            </div>
        </form>
        <div id="ctn-botao">
            <button onclick="salvarDados()">Salvar</button>
        </div>
        <label id="stt-compras">Imoveis do usuário</label>
        <div id="imoveis"></div>
    </div>
    <footer class="">
        <p>Copyright 2025 - By Lucas Hartmann</p>
        <a href="https://github.com/lucashartmann" target="_blank"><i class="fab fa-github"></i></a>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>


</body>
<!-- <script src="../js/login.js"></script> -->
<script type="text/javascript">
    fetch("nav.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
            var script = document.createElement('script');
            script.src = '../js/base.js';
            script.type = 'text/javascript';
            script.async = false;
            document.body.appendChild(script);
        });
</script>
<script src="../js/base.js"></script>
<script src="../js/dados-cliente.js"></script>

</html>
