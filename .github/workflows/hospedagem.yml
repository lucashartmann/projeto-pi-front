name: Deploy para InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Enviar para InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          server-dir: /htdocs/
          local-dir: ./

          dangerous-clean-slate: false

          exclude: |
            **/.git/**
            **/.github/**
            **/.phpunit.cache/**
            **/tests/**
            # **/vendor/**
            .env
            .gitignore
            comandos.md
            composer.json
            composer.lock
            converter.php
            php.ini
            phpunit.xml
            README.md
            TODO.md
            assets/imoveis/*/
            assets/imoveis/*/*/
